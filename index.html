<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2급 언어재활사 CBT 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f1f3; --paper:#ffffff; --ink:#1c2430; --sub:#5b6776; --line:#e3d2d7;
  --bar:#3d2f4d; --bar-ink:#ffffff; --accent:#d4728a; --accent-soft:#fff0f3;
  --mark:#d4728a; --ok:#1d7a4d; --ok-soft:#dcf1e5; --bad:#b3362d; --bad-soft:#f8e1de; --warn:#b86e00;
  --qfont:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --ufont:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171e; --paper:#1b222c; --ink:#e6ebf1; --sub:#9aa7b6; --line:#334050;
  --bar:#2e2433; --accent:#f5a0b1; --accent-soft:#4a2a35; --mark:#f5a0b1;
  --ok:#5cc58f; --ok-soft:#1d3a2b; --bad:#f08379; --bad-soft:#44241f; --warn:#f0b050;}}
:root[data-theme="dark"]{
  --bg:#12171e; --paper:#1b222c; --ink:#e6ebf1; --sub:#9aa7b6; --line:#334050;
  --bar:#2e2433; --accent:#f5a0b1; --accent-soft:#4a2a35; --mark:#f5a0b1;
  --ok:#5cc58f; --ok-soft:#1d3a2b; --bad:#f08379; --bad-soft:#44241f; --warn:#f0b050;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ufont);font-size:16px;line-height:1.55}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- 홈 ---------- */
.home{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.home h1{font-size:26px;margin:0 0 4px;letter-spacing:-0.02em}
.home .lead{color:var(--sub);margin:0 0 26px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:18px}
.sheet h2{font-size:17px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:10px 18px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.ptable tr:last-child td{border-bottom:0}
.ptable .pname{font-weight:700;white-space:nowrap}
.ptable .num{text-align:right;white-space:nowrap;color:var(--sub)}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:3px;margin-left:6px}
.tag.ready{background:var(--ok-soft);color:var(--ok)}
.tag.wait{background:var(--bg);color:var(--sub)}
.actions{padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1620}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-size:12px;opacity:.85}
.note{font-size:14px;color:var(--sub);padding:0 18px 14px}
.setpick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.setpick button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 14px;font-weight:700;min-width:84px;text-align:left}
.setpick button small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.setpick button[aria-selected="true"]{background:var(--bar);border-color:var(--bar);color:#fff}
.setpick button[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.hist li{margin:4px 0}
.hist{padding:10px 18px 14px 38px;margin:0;font-size:15px}

/* ---------- 시험 화면 ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
.topbar .ttl{font-weight:700}
.topbar .meta{font-size:14px;opacity:.85}
.topbar .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;background:rgba(255,255,255,.12);padding:3px 12px;border-radius:4px}
.timer.low{background:#b3362d}
.fsbtns{display:flex;gap:4px}
.fsbtns button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:3px;padding:2px 9px}
.fsbtns button[aria-pressed="true"]{background:#fff;color:var(--bar)}
.workspace{flex:1;display:flex;min-height:0}
.qpane{flex:1;overflow-y:auto;background:var(--paper);padding:26px 28px 40px}
.qinner{max-width:760px}
.qhead{display:flex;align-items:baseline;gap:10px;color:var(--sub);font-size:14px;margin-bottom:10px}
.qnum{font-size:calc(var(--fs) + 8px);font-weight:700;color:var(--ink);font-family:var(--ufont)}
.qtext{font-family:var(--qfont);font-size:calc(var(--fs) + 1px);font-weight:600;line-height:1.7;margin:0 0 16px}
.qnote{margin:-8px 0 14px;font-size:13px;color:var(--sub)}
.qimg{display:block;max-width:100%;margin:0 0 18px;background:#fff;border-radius:6px}
.box{border:1px solid var(--ink);border-radius:8px;padding:12px 16px;margin:0 0 18px;font-family:var(--qfont);font-size:var(--fs);line-height:1.75}
.box div{padding-left:0}
.opts{list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin:2px 0;border-radius:6px;cursor:pointer;font-family:var(--qfont);font-size:var(--fs);line-height:1.65;border:1px solid transparent}
.opt:hover{background:var(--accent-soft)}
.opt .c{flex:none;width:1.6em;height:1.6em;border:1.5px solid var(--sub);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--ufont);font-size:.85em;margin-top:.05em}
.opt>span:nth-child(2){white-space:pre-line}
.oimg{height:2.6em;vertical-align:middle;background:#fff;border-radius:3px;padding:1px 3px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .c{background:var(--mark);border-color:var(--mark);color:#fff}
.navrow{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.omr{width:300px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.omr h3{margin:0;font-size:15px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.omr h3 span{font-weight:400;color:var(--sub)}
.omrlist{overflow-y:auto;flex:1;padding:6px 8px 12px}
.omrsub{font-size:13px;color:var(--sub);padding:10px 6px 4px;font-weight:700}
.orow{display:flex;align-items:center;gap:3px;padding:3px 4px;border-radius:4px}
.orow.cur{background:var(--accent-soft)}
.orow .n{width:34px;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;font-size:14px;cursor:pointer;border:0;background:none}
.orow .b{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:13px;padding:0}
.orow .b.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.omrfoot{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--paper);border-top:1px solid var(--line)}
.omrfoot .btn{padding:9px 6px;font-size:14px}
.mobbar{display:none}

@media (max-width:860px){
  .omr{position:fixed;inset:auto 0 0 0;width:auto;height:72vh;z-index:20;transform:translateY(100%);transition:transform .2s;border-left:0;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .omr.open{transform:none}
  .qpane{padding:18px 16px 90px}
  .mobbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:15}
  .mobbar .btn{flex:1;padding:10px 4px;font-size:14px}
  .navrow{display:none}
  .topbar .meta{display:none}
}
@media (prefers-reduced-motion:reduce){.omr{transition:none}}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog{background:var(--paper);border-radius:8px;max-width:420px;width:100%;padding:22px}
.dialog h4{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 14px;color:var(--sub)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;max-height:40vh;overflow:auto}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:3px 9px;font-variant-numeric:tabular-nums}

/* ---------- 결과 ---------- */
.result{max-width:820px;margin:0 auto;padding:24px 16px 60px}
.verdict{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.verdict .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.verdict .big small{font-size:18px;color:var(--sub);font-weight:400}
.verdict .v{font-size:20px;font-weight:700}
.verdict .v.pass{color:var(--ok)} .verdict .v.fail{color:var(--bad)}
.verdict .d{color:var(--sub);font-size:14px}
.stable{width:100%;border-collapse:collapse;background:var(--paper)}
.stable th,.stable td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.stable th{font-size:13px;color:var(--sub);font-weight:500}
.stable td.r{text-align:right;font-variant-numeric:tabular-nums}
.bad{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.filters{display:flex;gap:6px;margin:22px 0 10px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:6px 12px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:12px}
.rv .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--sub);margin-bottom:8px}
.rv .st.o{color:var(--ok);font-weight:700}.rv .st.x{color:var(--bad);font-weight:700}.rv .st.u{color:var(--warn);font-weight:700}
.rv .opt{cursor:default}
.rv .opt:hover{background:none}
.rv .opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.rv .opt.correct .c{background:var(--ok);border-color:var(--ok);color:#fff}
.rv .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.rv .opt.wrong .c{background:var(--bad);border-color:var(--bad);color:#fff}
.rv .opt .lab{margin-left:auto;font-family:var(--ufont);font-size:13px;white-space:nowrap;padding-left:8px}
.expl{margin-top:12px;padding:12px 14px;background:var(--bg);border-radius:4px;font-size:15px}
.expl b{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
.expl.none{color:var(--sub)}
.ebody p{margin:4px 0;white-space:pre-line}
.ebody .ctwrap{margin:8px 0}
.concept{margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.concept summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;color:var(--sub)}
.concept .cbody{padding:0 14px 12px;font-size:15px;line-height:1.7}
.concept .cbody p{margin:8px 0;white-space:pre-line}
.concept .csrc{font-size:13px;color:var(--sub)}
.ctwrap{overflow-x:auto;margin:8px 0}
.ctable{border-collapse:collapse;font-size:14px;min-width:100%}
.ctable th,.ctable td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.ctable td{min-width:5.5em}.ctable td:last-child{min-width:13em}
.ctable th{background:var(--bg);font-weight:600;white-space:nowrap}


/* ---------- 랜덤 연습 ---------- */
.subpick{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 4px}
.subpick button{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:6px 12px;font-size:14px}
.subpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rstat{font-size:14px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:4px}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:3px;padding:3px 10px}
.rpane{flex:1;overflow-y:auto;background:var(--paper);padding:26px 28px 60px}
.rverdict{font-weight:700;margin:14px 0 0;font-size:17px}
.smode{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 16px 0}.smode-l{font-size:14px;color:var(--sub);margin-right:4px}
.rscore{font-size:20px;margin:6px 0}.rscore b{font-size:28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:6px 0 14px}
.rg{min-height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:15px}
.rg.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.rg.x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}.rg.na{background:#f1f3f5;color:var(--sub)}
.rverdict.o{color:var(--ok)} .rverdict.x{color:var(--bad)}
.rnext{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:860px){.rpane{padding:18px 16px 60px}}
/* ---------- 제14회 답안지 ---------- */
.k14pane{flex:1;overflow-y:auto;background:var(--bg);padding:20px 16px 60px}
.k14inner{max-width:900px;margin:0 auto}
.k14guide{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px;font-size:15px;color:var(--sub)}
.k14guide a{color:var(--accent)}
.k14sub{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
.k14sub h3{margin:0;font-size:15px;padding:10px 14px;border-bottom:1px solid var(--line)}
.k14grid{column-width:240px;column-gap:18px;padding:8px 10px}
.k14grid .orow{break-inside:avoid;margin:2px 0}
.k14foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.ktable{width:100%;border-collapse:collapse;background:var(--paper);font-variant-numeric:tabular-nums}
.ktable th,.ktable td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
.ktable th{font-size:13px;color:var(--sub);font-weight:500}
.ktable tr.x td{background:var(--bad-soft)}
.ktable tr.u td{background:var(--bg)}

/* ---------- 로그인 ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authbox{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:28px 24px}
.authbox h1{font-size:22px;margin:0 0 6px}
.authlogo{display:block;width:220px;max-width:80%;height:auto;margin:0 auto 22px;border-radius:6px}
.authbox p{color:var(--sub);margin:0 0 20px;font-size:15px}
.authbox label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
.authbox input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:16px;background:var(--paper);color:var(--ink)}
.authbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
.authbox .btn{width:100%;margin-top:20px;justify-content:center}
.autherr{color:var(--bad);font-size:14px;margin-top:12px;min-height:20px}
.userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:-10px 0 20px;font-size:14px;color:var(--sub)}
.userbar select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:15px;background:var(--paper);color:var(--ink)}
.syncdot{font-size:13px;color:var(--sub)}

/* ---------- 관리자 ---------- */
.adm .form{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:8px;padding:14px 18px;align-items:end}
.adm .form label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px}
.adm input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:15px;background:var(--paper);color:var(--ink)}
.adm .msg{padding:0 18px 12px;font-size:14px;min-height:18px}
.adm table{width:100%;border-collapse:collapse;font-size:14px}
.adm th,.adm td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.adm th{color:var(--sub);font-weight:500;font-size:13px}
.adm td .btn{padding:4px 10px;font-size:13px;margin:2px 4px 2px 0}
.tbl-wrap{overflow-x:auto}
@media (max-width:720px){.adm .form{grid-template-columns:1fr}}
.dialog input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:10px;font-size:16px;margin:0 0 14px}

/* ---------- 실제 CBT 모양 시험 화면 (1단계: 화면 틀) ---------- */
.cbt{--c-bg:#ffffff;--c-ink:#1b1b1b;--c-sub:#68738a;--c-line:#2b2b2b;--c-side:#fdf6f8;--c-soft:#fff0f3;--c-sel:#fde3e9;
  --c-teal:#e8708a;--c-blue:#d4728a;--c-red:#e0362c;
  display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--c-bg);color:var(--c-ink);font-family:var(--ufont)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cbt{--c-bg:#1b222c;--c-ink:#e6ebf1;--c-sub:#9aa7b6;--c-line:#5a6573;--c-side:#161c24;--c-soft:#3a2730;--c-sel:#4a2a35}}
:root[data-theme="dark"] .cbt{--c-bg:#1b222c;--c-ink:#e6ebf1;--c-sub:#9aa7b6;--c-line:#5a6573;--c-side:#161c24;--c-soft:#3a2730;--c-sel:#4a2a35}
.cbt button{font-family:var(--ufont)}
.cbt-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 24px;border-bottom:2px solid var(--c-line)}
.cbt-ttl{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.cbt-clock{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.55;white-space:nowrap}
.cbt-clockic{width:46px;height:46px;flex:none;background:var(--c-red);border:1px solid #9b1c14;display:flex;align-items:center;justify-content:center}
.cbt-remain{background:var(--c-red);color:#fff;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums}
.cbt-name{justify-self:end;font-size:18px;white-space:nowrap}
.cbt-body{flex:1;display:flex;min-height:0}
.cbt-side{width:190px;flex:none;border-right:2px solid var(--c-line);background:var(--c-side);padding:16px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.cbt-box{border:2px solid var(--c-line);background:var(--c-bg);padding:10px 8px;text-align:center}
.cbt-boxt{font-size:14px;color:var(--c-sub);font-weight:700;margin-bottom:8px}
.cbt-fs{display:flex;gap:4px;justify-content:center}
.cbt-fs button{border:1px solid var(--c-line);background:var(--c-bg);color:var(--c-ink);width:50px;padding:5px 0 4px;line-height:1.15}
.cbt-fs button b{display:block}
.cbt-fs button:nth-child(1) b{font-size:15px}.cbt-fs button:nth-child(2) b{font-size:19px}.cbt-fs button:nth-child(3) b{font-size:23px}
.cbt-fs small{font-size:11px;color:var(--c-sub)}
.cbt-fs button[aria-pressed="true"]{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.cbt-fs button[aria-pressed="true"] small{color:#fff}
.cbt-main{flex:1;display:flex;flex-direction:column;min-width:0}
.cbt-prog{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:2px solid var(--c-line);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cbt-bar{flex:1;height:16px;border:1.5px solid var(--c-line);background:var(--c-bg)}
.cbt-bar i{display:block;height:100%;width:0;background:var(--c-blue);transition:width .2s}
.cbt-paper{flex:1;overflow-y:auto;padding:28px 40px 40px}
.cbt-card{max-width:1100px;margin:0 auto;border:2px solid var(--c-line);padding:28px 32px 32px;font-size:var(--fs);line-height:1.6}
.cbt-qhead{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;margin-bottom:16px}
.cbt-qt{flex:1}
.cbt-subj{flex:none;background:var(--c-teal);color:#fff;font-size:14px;font-weight:700;padding:5px 12px;line-height:1.3;white-space:nowrap}
.cbt-note{margin:-8px 0 14px;font-size:13px;color:var(--c-sub)}
.cbt-stem{border:1.5px solid var(--c-line);background:var(--c-soft);padding:14px 20px;margin:0 0 16px;line-height:1.8}
.cbt-card .qimg{margin:0 0 16px}
.cbt-ch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cbt-opt{display:flex;align-items:flex-start;gap:14px;border:1.5px solid var(--c-line);padding:12px 16px;cursor:pointer}
.cbt-opt:hover{background:var(--c-soft)}
.cbt-num{flex:none;min-width:1.65em;height:1.65em;border:1.5px solid var(--c-line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;margin-top:.05em}
.cbt-ctext{flex:1;white-space:pre-line}
.cbt-opt.sel{background:var(--c-sel);border-color:var(--c-blue)}
.cbt-opt.sel .cbt-num{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.cbt-foot{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:2px solid var(--c-line);background:var(--c-side);flex-wrap:wrap}
.cbt-fl,.cbt-fr{display:flex;gap:10px;flex:1}
.cbt-fr{justify-content:flex-end}
.cbt-fc{display:flex;align-items:center;gap:14px}
.cbt-fc b{font-size:20px;min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums}
.cbtn{border:2px solid var(--c-line);background:var(--c-bg);color:var(--c-ink);padding:10px 18px;font-weight:700;font-size:16px;white-space:nowrap}
.cbtn:hover{background:var(--c-soft)}
.cbt-submit{background:var(--c-blue);border-color:var(--c-blue);color:#fff;padding:10px 28px}
.cbt-submit:hover{background:var(--c-blue);filter:brightness(1.08)}
.chips button.done{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:860px){
  .cbt-top{grid-template-columns:1fr auto;padding:8px 12px;gap:6px 10px}
  .cbt-ttl{font-size:16px;grid-column:1/-1}
  .cbt-clock{font-size:13px;gap:8px}.cbt-clockic{width:36px;height:36px}
  .cbt-name{font-size:14px}
  .cbt-body{flex-direction:column}
  .cbt-side{width:auto;flex-direction:row;border-right:0;border-bottom:2px solid var(--c-line);padding:8px;overflow-x:auto}
  .cbt-box{display:flex;align-items:center;gap:8px;padding:4px 8px}.cbt-boxt{margin:0}
  .cbt-prog{padding:8px 12px}
  .cbt-paper{padding:14px 12px 24px}
  .cbt-card{padding:16px 14px}
  .cbt-qhead{flex-wrap:wrap}.cbt-qhead::before{content:"";order:0;flex-basis:100%}.cbt-subj{order:-1;margin-bottom:-6px}
  .cbt-foot{padding:8px 10px;gap:8px}
  .cbt-fl,.cbt-fc,.cbt-fr{flex:1 1 100%;justify-content:center}
  .cbtn{padding:8px 10px;font-size:14px;flex:1}
  .cbt-fc .cbtn{flex:1}
}
</style>
</head>
<body>

<div id="auth" class="auth"></div>
<div id="home" class="home hidden"></div>
<div id="admin" class="home adm hidden"></div>
<div id="exam" class="exam hidden"></div>
<div id="result" class="result hidden"></div>
<div id="rand" class="exam hidden"></div>
<div id="k14" class="exam hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Supabase 연결 설정 (anon key 한 줄만 바꿔 주세요) ===== */
const SUPABASE_URL = "https://vdubgrxwijydwfabwpnk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdWJncnh3aWp5ZHdmYWJ3cG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDk1ODgsImV4cCI6MjA5NzE4NTU4OH0.nqNO3vany3M6fzmG5BG6QVdvi8BW2UbhTDhxNnwvA88";
/* ============================================================ */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let SETS = [];
const K_SET="slp2cbt.set";
let DATA = null, BOOKS = [], BOOK = null, USER = null, ROLE = "member";
let USER_NAME = "";   // 시험 화면 오른쪽 위 "성명"에 보여 줄 이름(이용자 관리에서 정한 이름)
const CIRC = ["①","②","③","④","⑤"];
const PER_Q_MIN = {p1:75/80, p2:65/70};
/* 기록 저장: 계정(Supabase)에 저장하고, 이 기기에도 사본을 둬요. 글자 크기만 기기별로 저장. */
const CACHE = {}; const pending = {}; let syncT = null;
function dbKey(k){ return k==="slp2cbt.fs" ? k : `${BOOK?BOOK.id:"_"}|${k}`; }
function localKey(k){ return `cbt:${USER?USER.id:"_"}:${dbKey(k)}`; }
const LS = {
  get(k,d){ const K=dbKey(k); if(K in CACHE) return CACHE[K]===null?d:CACHE[K];
    try{const v=localStorage.getItem(localKey(k));return v?JSON.parse(v):d}catch(e){return d} },
  set(k,v){ const K=dbKey(k); CACHE[K]=v; try{localStorage.setItem(localKey(k),JSON.stringify(v))}catch(e){}
    if(USER){pending[K]={v}; queueSync()} },
  del(k){ const K=dbKey(k); CACHE[K]=null; try{localStorage.removeItem(localKey(k))}catch(e){}
    if(USER){pending[K]={del:true}; queueSync()} }
};
function queueSync(){ clearTimeout(syncT); syncT=setTimeout(flushSync,700); }
async function flushSync(){
  clearTimeout(syncT); const items=Object.entries(pending); if(!items.length||!USER) return;
  items.forEach(([K])=>delete pending[K]);
  const ups=items.filter(([,x])=>!x.del).map(([K,x])=>({user_id:USER.id,key:K,value:x.v,updated_at:new Date().toISOString()}));
  const dels=items.filter(([,x])=>x.del).map(([K])=>K);
  try{
    if(ups.length){const {error}=await sb.from("cbt_progress").upsert(ups); if(error) throw error;}
    if(dels.length){const {error}=await sb.from("cbt_progress").delete().eq("user_id",USER.id).in("key",dels); if(error) throw error;}
  }catch(e){ items.forEach(([K,x])=>{ if(!(K in pending)) pending[K]=x; }); syncT=setTimeout(flushSync,5000); }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushSync(); });
window.addEventListener("pagehide",flushSync);
const K_RUN="slp2cbt.run", K_WRONG="slp2cbt.wrong", K_HIST="slp2cbt.hist", K_FS="slp2cbt.fs";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 모든 문제에 고유 id
const QMAP={};
function indexQs(){ Object.keys(QMAP).forEach(k=>delete QMAP[k]);
  SETS.forEach(S=>S.periods.forEach(p=>p.subjects.forEach(s=>s.qs.forEach(q=>{
    q.id=`${S.set}-${s.id}-${q.n}`; q.subj=s.name; q.sid=s.id; q.pid=p.id; q.set=S.set; QMAP[q.id]=q;
  })))); }
const ready=s=>s.qs.length===s.count;
const optBody=(q,k,t)=>q.oi?`<img class="oimg" src="${q.oi[k]}" alt="${esc(t)}">`:esc(t);

let run=null, timerH=null, fs=LS.get(K_FS,1);

/* ================= 홈 ================= */
function renderHome(){
  show("home");
  if(BOOK&&BOOK.id==="_past") return renderPastHome();
  if(isStudy(BOOK)&&STUDY) return renderStudyHome();
  if(!DATA){
    $("#home").innerHTML=`<h1>2급 언어재활사 CBT 연습</h1><div class="userbar"><span>${bookSelHtml()}</span>
      <span>${esc(USER.email)} · ${ROLE==="admin"?`<button class="btn" id="adminBtn" style="padding:4px 10px">이용자 관리</button> `:""}<button class="btn" id="logout" style="padding:4px 10px">로그아웃</button></span></div>
      <div class="sheet"><h2>${esc(BOOK.title)}</h2><p class="note" style="padding-top:12px">이 문제집은 아직 문제가 올라오지 않았어요.</p></div>`;
    $("#logout").onclick=async()=>{await flushSync();await sb.auth.signOut();location.reload()};
    const bs=$("#bookSel"); if(bs) bs.onchange=async()=>{await flushSync();await openBook(bs.value)};
  if($("#adminBtn")) $("#adminBtn").onclick=renderAdmin;
    return;
  }
  const wrong=LS.get(K_WRONG,{});
  const ORD=Object.keys(QMAP); const wrongIds=Object.keys(wrong).filter(id=>QMAP[id]).sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
  const wsub=SUBJS.map(([sid,n])=>[n,wrongIds.filter(id=>QMAP[id].sid===sid).length]).filter(x=>x[1]);
  const hist=LS.get(K_HIST,[]);
  const saved=LS.get(K_RUN,null);
  let h=`<h1>2급 언어재활사 CBT 연습</h1>
  <p class="lead">실제 시험과 같은 교시 구성과 시간으로 풀어요.</p>
  <div class="userbar"><span>${bookSelHtml()}</span>
    <span>${esc(USER.email)} · ${ROLE==="admin"?`<button class="btn" id="adminBtn" style="padding:4px 10px">이용자 관리</button> `:""}<button class="btn" id="logout" style="padding:4px 10px">로그아웃</button></span></div>
  ${homeExtras()}
  <div class="sheet"><h2>오답노트 · ${wrongIds.length}문항</h2>
    ${wrongIds.length?`<p class="note" style="padding-top:12px">${wsub.map(([n,c])=>`${n} ${c}`).join(' · ')}</p><div class="actions"><button class="btn primary" id="wrongRun">틀린 문제만 다시 풀기</button><button class="btn" id="wrongView">목록 보기</button><button class="btn" id="wrongClear">오답노트 비우기</button></div>
    <p class="note">시험을 제출하면 틀리게 고른 문제가 모여요(표기하지 않은 문제는 빠져요). 다시 풀어서 맞히면 오답노트에서 빠져요.</p>`:`<p class="note" style="padding-top:12px">시험을 제출하면 틀리게 고른 문제가 여기에 모여요.</p>`}</div>
  <div class="setpick" role="tablist" aria-label="회차 선택">${SETS.map(S=>{const n=S.periods.reduce((a,p)=>a+p.subjects.reduce((b,s)=>b+s.qs.length,0),0);
    return `<button role="tab" data-set="${S.set}" aria-selected="${S.set===DATA.set}">SET ${S.set}<small>${n}/150</small></button>`}).join('')}</div>`;
  if(saved){
    h+=`<div class="sheet"><h2>풀던 시험이 있어요</h2>
      <p class="note" style="padding-top:12px">${esc(saved.label)} · ${Object.keys(saved.ans).length}/${saved.ids.length}문항 표기함</p>
      <div class="actions"><button class="btn primary" id="resume">이어서 풀기</button><button class="btn" id="discard">버리고 새로 시작</button></div></div>`;
  }
  DATA.periods.forEach(p=>{
    const total=p.subjects.reduce((a,s)=>a+s.count,0);
    const allReady=p.subjects.every(ready);
    h+=`<div class="sheet"><h2>${p.name} · ${total}문항 · ${p.min}분</h2><table class="ptable">`;
    p.subjects.forEach(s=>{
      const m=Math.round(s.count*PER_Q_MIN[p.id]);
      h+=`<tr><td class="pname">${s.name}${ready(s)?'<span class="tag ready">풀 수 있음</span>':`<span class="tag wait">준비 중</span>`}</td>
      <td class="num">${s.count}문항</td>
      <td class="num">${ready(s)?`<button class="btn" data-subj="${s.id}">과목 풀기<small>${m}분</small></button>`:''}</td></tr>`;
    });
    h+=`</table><div class="actions"><button class="btn primary" data-period="${p.id}" ${allReady?'':'disabled'}>${p.name} 실전 시작 (${p.min}분)</button></div>
    ${allReady?'':`<p class="note">세 과목이 모두 준비되면 ${p.name} 실전을 풀 수 있어요. 지금은 과목별로 풀어 보세요.</p>`.replace('세 과목',p.subjects.length===2?'두 과목':'세 과목')}</div>`;
  });
  if(hist.length){
    h+=`<div class="sheet"><h2>최근 기록</h2><ul class="hist">${hist.slice(-8).reverse().map(r=>`<li>${esc(r.date)} · ${esc(r.label)} · <b>${r.score}/${r.total}</b> (${Math.round(r.score/r.total*100)}%)</li>`).join('')}</ul></div>`;
  }
  $("#home").innerHTML=h;
  bindHomeExtras();
  $("#logout").onclick=()=>confirmBox("로그아웃할까요?","기록은 계정에 저장되어 있어서 다시 로그인하면 이어서 볼 수 있어요.","로그아웃",async()=>{await flushSync();await sb.auth.signOut();location.reload()});
  const bs=$("#bookSel"); if(bs) bs.onchange=async()=>{await flushSync();await openBook(bs.value)};
  if($("#adminBtn")) $("#adminBtn").onclick=renderAdmin;
  $("#home").querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{DATA=SETS.find(S=>S.set===b.dataset.set);LS.set(K_SET,DATA.set);renderHome()});
  $("#home").querySelectorAll("[data-subj]").forEach(b=>b.onclick=()=>startSubject(b.dataset.subj));
  $("#home").querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>startPeriod(b.dataset.period));
  if(saved){$("#resume").onclick=()=>{run=saved;renderExam()};$("#discard").onclick=()=>{LS.del(K_RUN);renderHome()}}
  if(wrongIds.length){
    $("#wrongRun").onclick=()=>startCustom(wrongIds,"오답 다시 풀기");
    $("#wrongView").onclick=()=>{const ans={};wrongIds.forEach(id=>{if(wrong[id]&&wrong[id].my)ans[id]=wrong[id].my});run={label:"오답노트",ids:wrongIds,ans,mode:"view"};renderResult(true)};
    $("#wrongClear").onclick=()=>confirmBox("오답노트를 비울까요?","모아 둔 틀린 문제 기록이 모두 지워져요.","비우기",()=>{LS.del(K_WRONG);renderHome()});
  }
}
function newRun(label,ids,minutes,kind){
  run={label,ids,ans:{},cur:0,endAt:Date.now()+minutes*60000,minutes,kind};
  LS.set(K_RUN,run); renderExam();
}
function startSubject(sid){
  for(const p of DATA.periods)for(const s of p.subjects)if(s.id===sid){
    const m=Math.round(s.count*PER_Q_MIN[p.id]);
    confirmBox(`${s.name} 과목 풀기`,`${s.count}문항 · 제한시간 ${m}분 (실전과 같은 문항당 시간 비율)`,"시작",()=>newRun(`${DATA.title} ${s.name}`,s.qs.map(q=>q.id),m,"subject"));
  }
}
function startPeriod(pid){
  const p=DATA.periods.find(x=>x.id===pid);
  const ids=[];p.subjects.forEach(s=>s.qs.forEach(q=>ids.push(q.id)));
  confirmBox(`${p.name} 실전 시작`,`${ids.length}문항 · 제한시간 ${p.min}분. 시간이 끝나면 자동으로 제출돼요.`,"시작",()=>newRun(`${DATA.title} ${p.name}`,ids,p.min,"period"));
}
function startCustom(ids,label){
  const m=Math.max(1,Math.round(ids.reduce((a,id)=>a+PER_Q_MIN[QMAP[id].pid],0)));
  confirmBox(label,`${ids.length}문항 · 제한시간 ${m}분`,"시작",()=>newRun(label,ids,m,"custom"));
}

/* ================= 시험 화면 (실제 CBT 모양) ================= */
const CBT_FS=[13.6,17,21.25];   // 글자 크기 80% · 100% · 125%
const CLOCK_SVG='<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><path d="M13 6.5V13l4 2.5" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="13" r="1.4" fill="#e0362c"/></svg>';
function renderExam(){
  show("exam");
  document.documentElement.style.setProperty("--fs",CBT_FS[fs]+"px");
  const who=USER_NAME||(USER&&USER.email?USER.email.split("@")[0]:"");
  $("#exam").innerHTML=`<div class="cbt">
  <header class="cbt-top">
    <div class="cbt-ttl">${esc(run.label)}</div>
    <div class="cbt-clock"><span class="cbt-clockic">${CLOCK_SVG}</span>
      <div><div>제한시간 : ${run.minutes}분</div><div>남은시간 : <span class="cbt-remain" id="timer" aria-live="off">--분 --초</span></div></div></div>
    <div class="cbt-name">성명 : ${esc(who)}</div>
  </header>
  <div class="cbt-body">
    <aside class="cbt-side" aria-label="시험 도구">
      <div class="cbt-box"><div class="cbt-boxt">글자 크기</div>
        <div class="cbt-fs">${[80,100,125].map((p,i)=>`<button data-fs="${i}" aria-pressed="${i===fs}" aria-label="글자 크기 ${p}%"><b>가</b><small>${p}%</small></button>`).join('')}</div></div>
    </aside>
    <section class="cbt-main">
      <div class="cbt-prog"><span id="progText"></span><div class="cbt-bar" aria-hidden="true"><i id="progBar"></i></div></div>
      <main class="cbt-paper" id="qpane" tabindex="-1"></main>
    </section>
  </div>
  <footer class="cbt-foot">
    <div class="cbt-fl"><button class="cbtn" id="cHome">↩ 처음으로</button></div>
    <div class="cbt-fc"><button class="cbtn" id="prev">◀ 이전</button><b id="pageInfo"></b><button class="cbtn" id="next">다음 ▶</button></div>
    <div class="cbt-fr"><button class="cbtn" id="fAll">전체 문제 (<span id="cntAll"></span>)</button><button class="cbtn" id="unans">안푼 문제 (<span id="cntUn"></span>)</button><button class="cbtn cbt-submit" id="submit">제출하기</button></div>
  </footer></div>`;
  $("#exam").querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{fs=+b.dataset.fs;LS.set(K_FS,fs);
    document.documentElement.style.setProperty("--fs",CBT_FS[fs]+"px");
    $("#exam").querySelectorAll("[data-fs]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.fs===fs))});
  $("#unans").onclick=()=>showUnanswered("un");
  $("#fAll").onclick=()=>showUnanswered("all");
  $("#submit").onclick=askSubmit;
  $("#prev").onclick=()=>go(run.cur-1);
  $("#next").onclick=()=>go(run.cur+1);
  $("#cHome").onclick=()=>confirmBox("처음 화면으로 갈까요?","지금까지 고른 답은 저장되어 있어서 처음 화면의 '이어서 풀기'로 돌아올 수 있어요. 나가 있는 동안에도 시험 시간은 계속 흘러요.","처음으로",()=>{clearInterval(timerH);run=null;renderHome()});
  drawQ(); tick();
  clearInterval(timerH); timerH=setInterval(tick,1000);
}
function refreshOmr(){   // 진행 막대 · 아래쪽 문제 수 · 쪽 번호 갱신
  const total=run.ids.length, done=run.ids.filter(id=>run.ans[id]).length;
  const pb=$("#progBar"); if(pb) pb.style.width=(total?done/total*100:0)+"%";
  const pt=$("#progText"); if(pt) pt.textContent=`${done} / ${total} 문항 풀이`;
  const ca=$("#cntAll"); if(ca) ca.textContent=total;
  const cu=$("#cntUn"); if(cu) cu.textContent=total-done;
  const pi=$("#pageInfo"); if(pi) pi.textContent=`${run.cur+1}/${total}`;
}
function drawQ(){
  const i=run.cur, q=QMAP[run.ids[i]], my=run.ans[q.id];
  $("#qpane").innerHTML=`<div class="cbt-card">
    <div class="cbt-qhead"><span>${i+1}.</span><span class="cbt-qt">${esc(q.q)}</span><span class="cbt-subj">${esc(q.subj)}</span></div>

    <ul class="cbt-ch" role="radiogroup" aria-label="${i+1}번 보기">${q.o.map((t,k)=>`<li class="cbt-opt ${my===k+1?'sel':''}" role="radio" tabindex="0" aria-checked="${my===k+1}" data-k="${k+1}"><span class="cbt-num">${k+1}</span><span class="cbt-ctext">${optBody(q,k,t)}</span></li>`).join('')}</ul>
  </div>`;
  $("#qpane").querySelectorAll(".cbt-opt").forEach(li=>{

function mark(i,k){

  LS.set(K_RUN,run);

}
function go(i){ if(i<0||i>=run.ids.length)return; run.cur=i; LS.set(K_RUN,run); drawQ(); }
function tick(){

function finish(auto){
  clearInterval(timerH);

  const wrong=LS.get(K_WRONG,{});

/* ================= 랜덤 실전 모의고사 ================= */
const K_RDECK="slp2cbt.rdeck", K_RCNT="slp2cbt.rcnt";
const RP={p1:[["neuro",30],["flu",25],["voice",25]],p2:[["lang",35],["artic",35]]};
function drawFrom(sid,n){
  const D=LS.get(K_RDECK,{}), pool=poolIds([sid]);
  if(pool.length<n) throw new Error("문항 부족");
  let d=D[sid]; if(!d||d.deck.length!==pool.length||d.deck.some(id=>!QMAP[id])) d={deck:shuffle(pool.slice()),pos:0};
  const out=[];
  while(out.length<n){
    if(d.pos>=d.deck.length){d.deck=shuffle(pool.slice());d.pos=0}
    const id=d.deck[d.pos++]; if(!out.includes(id)) out.push(id);
  }
  D[sid]=d; LS.set(K_RDECK,D); return out;
}
function startRandPeriod(pid){
  const name=pid==="p1"?"1교시":"2교시", min=pid==="p1"?75:65, total=RP[pid].reduce((a,x)=>a+x[1],0);
  const go=()=>confirmBox(`랜덤 모의고사 ${name}`,`${total}문항 · 제한시간 ${min}분. 전 회차에서 과목별 문항 수에 맞춰 무작위로 뽑아요. 시간이 끝나면 자동으로 제출돼요.`,"시작",()=>{
    const ids=[]; RP[pid].forEach(([sid,n])=>ids.push(...drawFrom(sid,n)));
    const rc=LS.get(K_RCNT,{p1:0,p2:0}); rc[pid]++; LS.set(K_RCNT,rc);
    newRun(`랜덤 모의고사 ${name} (${rc[pid]}번째)`,ids,min,"period"); run.rp=pid; LS.set(K_RUN,run);
  });
  if(LS.get(K_RUN,null)) confirmBox("풀던 시험이 있어요","새 랜덤 시험을 시작하면 풀던 시험은 사라져요.","새로 시작",go); else go();
}

let k14=null, k14H=null;
function startK14(round,pid){
  const n=PAST[round][pid].length;
  confirmBox(`제${round}회 ${pid==="p1"?"1교시":"2교시"} 시작`,`${n}문항 · 제한시간 ${K14MIN[pid]}분. 문제지를 옆에 펴 두고 시작하세요. 시간이 끝나면 자동으로 제출돼요.`,"시작",()=>{
    k14={round,pid,ans:{},endAt:Date.now()+K14MIN[pid]*60000}; LS.set(K_K14,k14); renderK14();
  });
}
function renderK14(){
  show("k14");
  const pid=k14.pid, name=pid==="p1"?"1교시":"2교시";
  $("#k14").innerHTML=`<div class="topbar"><span class="ttl">제${k14.round}회 기출 · ${name}</span><span class="meta">${PAST[k14.round][pid].length}문항</span><span class="sp"></span>
    <span class="rstat" id="k14cnt"></span><span class="timer" id="k14timer">--:--</span></div>
    <div class="workspace"><main class="k14pane"><div class="k14inner">
    <div class="k14guide">문제지(${PAST[k14.round].year}년도 제${k14.round}회 ${name})를 보면서 번호를 눌러 답을 표기하세요. 같은 번호를 다시 누르면 표기가 지워져요. 문제지는 <a href="https://www.kuksiwon.or.kr" target="_blank" rel="noopener">국시원 홈페이지</a>에서도 확인할 수 있어요.</div>

      Array.from({length:b-a+1},(_,i)=>a+i).map(n=>`<div class="orow"><span class="n" style="cursor:default">${n}</span>${[1,2,3,4,5].map(k=>`<button class="b" data-n="${n}" data-k="${k}" aria-label="${n}번 ${k}번 표기">${k}</button>`).join('')}</div>`).join('')}</div></section>`).join('')}

    </div></main></div>`;
  $("#k14").querySelector(".k14pane").onclick=e=>{const t=e.target.closest("button[data-n]");if(!t)return;
    const n=+t.dataset.n,k=+t.dataset.k; if(k14.ans[n]===k) delete k14.ans[n]; else k14.ans[n]=k; LS.set(K_K14,k14); k14Refresh()};
  $("#k14home").onclick=()=>{k14=null;renderHome()};
  $("#k14submit").onclick=()=>{const un=PAST[k14.round][k14.pid].length-Object.keys(k14.ans).length;
    confirmBox("답안을 제출할까요?",un?`아직 표기하지 않은 문제가 ${un}개 있어요. 제출하면 답을 바꿀 수 없어요.`:"제출하면 답을 바꿀 수 없어요.","제출",()=>finishK14(false))};
  k14Refresh(); k14Tick(); clearInterval(k14H); k14H=setInterval(k14Tick,1000);
}
function k14Refresh(){
  $("#k14").querySelectorAll("button[data-n]").forEach(b=>b.classList.toggle("on",k14.ans[+b.dataset.n]===+b.dataset.k));
  $("#k14cnt").textContent=`표기 ${Object.keys(k14.ans).length}/${PAST[k14.round][k14.pid].length}`;
}
function k14Tick(){
  const left=Math.max(0,k14.endAt-Date.now()), s=Math.ceil(left/1000);
  const t=$("#k14timer"); if(!t)return;
  t.textContent=`남은 시간 ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  t.classList.toggle("low",s<=300);
  if(left<=0){clearInterval(k14H);finishK14(true)}
}
function finishK14(auto){
  clearInterval(k14H);
  const r=k14; LS.del(K_K14);
  const key=PAST[r.round][r.pid], name=r.pid==="p1"?"1교시":"2교시";
  const score=key.filter((a,i)=>r.ans[i+1]===a).length, total=key.length, pct=score/total*100;
  const subs=K14SUB[r.pid].map(([sn,a,b])=>{let c=0;for(let n=a;n<=b;n++)if(r.ans[n]===key[n-1])c++;return [sn,c,b-a+1]});
  const anyFail=subs.some(([,c,t])=>c/t<0.4), pass=pct>=60&&!anyFail;
  const hist=LS.get(K_HIST,[]); const d=new Date();
  hist.push({date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,label:`제${r.round}회 기출 ${name}`,score,total});
  LS.set(K_HIST,hist.slice(-40));
  show("result"); window.scrollTo(0,0);
  let f="all";
  const rows=()=>key.map((a,i)=>{const n=i+1,my=r.ans[n],st=!my?"u":(my===a?"o":"x");return {n,a,my,st}}).filter(x=>f==="all"||x.st===f);
  const draw=()=>{$("#k14list").innerHTML=`<table class="ktable"><tr><th>번호</th><th>과목</th><th>내 답</th><th>정답</th><th>결과</th></tr>${rows().map(x=>`<tr class="${x.st}"><td>${x.n}</td><td>${K14SUB[r.pid].find(([,a,b])=>x.n>=a&&x.n<=b)[0]}</td><td>${x.my?CIRC[x.my-1]:'-'}</td><td>${CIRC[x.a-1]}</td><td>${{o:'<span class="good">정답</span>',x:'<span class="bad">오답</span>',u:'안 풂'}[x.st]}</td></tr>`).join('')||'<tr><td colspan="5">해당하는 문제가 없어요.</td></tr>'}</table>`};
  $("#result").innerHTML=`<div class="verdict"><div class="big">${score}<small> / ${total}</small></div>
    <div><div class="v ${pass?'pass':'fail'}">제${r.round}회 ${name} · ${pass?'합격선 통과':'합격선 미달'} · ${Math.round(pct)}%</div>
    <div class="d">${auto?'제한시간이 끝나 자동 제출되었어요. ':''}합격 기준: 총점 60% 이상, 각 과목 40% 이상 (이 교시만 기준으로 판정). 채점 기준: 국시원 최종답안</div></div></div>
    <table class="stable"><tr><th>과목</th><th style="text-align:right">맞힌 수</th><th style="text-align:right">정답률</th><th>과락</th></tr>
    ${subs.map(([n,c,t])=>{const p=c/t;return `<tr><td>${n}</td><td class="r">${c}/${t}</td><td class="r">${Math.round(p*100)}%</td><td>${p<0.4?'<span class="bad">과락 (40% 미만)</span>':'<span class="good">통과</span>'}</td></tr>`}).join('')}</table>
    <div class="filters">${[["all","전체"],["x","틀린 문제"],["u","안 푼 문제"],["o","맞은 문제"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${k==="all"}">${t}</button>`).join('')}<span style="flex:1"></span><button class="btn" id="home3">처음으로</button></div>
    <div id="k14list"></div>`;
  $("#result").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;$("#result").querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===f));draw()});
  $("#home3").onclick=()=>{k14=null;renderHome()};
  draw();
}

function show(id){["auth","home","admin","exam","result","rand","k14"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id)); if(id!=="exam")clearInterval(timerH); if(id!=="k14")clearInterval(k14H)}
function confirmBox(title,body,ok,fn){
  $("#modal").innerHTML=`<div class="dialog"><h4>${esc(title)}</h4><p>${esc(body)}</p><div class="row"><button class="btn" id="mno">취소</button><button class="btn primary" id="myes">${esc(ok)}</button></div></div>`;
  $("#modal").classList.remove("hidden");
  $("#mno").onclick=closeModal; $("#myes").onclick=()=>{closeModal();fn()};
  $("#myes").focus();
}
function closeModal(){$("#modal").classList.add("hidden");$("#modal").innerHTML=""}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#modal").classList.contains("hidden"))closeModal();
  if(!$("#rand").classList.contains("hidden")&&$("#modal").classList.contains("hidden")){
    if(e.target.closest&&e.target.closest("input,textarea"))return;
    if(st){ // 풀이집 화면
      if(e.target.closest&&e.target.closest(".opt,button,summary"))return;
      const exam=st.mode==="exam", locked=exam?!!st.graded:st.pick!=null;
      if(/^[1-5]$/.test(e.key)&&!locked&&$("#rpane .opt[data-k]"))studyPick(+e.key);
      else if((e.key==="Enter"||e.key==="ArrowRight")&&$("#snext")&&(exam||locked)){e.preventDefault();$("#snext").click()}
      else if(e.key==="ArrowLeft"&&$("#sprev")){e.preventDefault();$("#sprev").click()}
      return;
    }
    if(!rs)return;
    if(/^[1-5]$/.test(e.key)&&!rs.done)randPick(+e.key);
    else if((e.key==="Enter"||e.key==="ArrowRight")&&rs.done){e.preventDefault();randNext()}
    return;
  }
  if($("#exam").classList.contains("hidden")||!$("#modal").classList.contains("hidden"))return;
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="ArrowRight")go(run.cur+1);
  else if(e.key==="ArrowLeft")go(run.cur-1);
  else if(/^[1-5]$/.test(e.key))mark(run.cur,+e.key);
});

async function adminCall(body){
  const {data,error}=await sb.functions.invoke("cbt-admin",{body});
  if(error){ let m=error.message; try{const j=await error.context.json(); if(j&&j.error) m=j.error;}catch(e){} throw new Error(m); }
  if(data&&data.error) throw new Error(data.error);
  return data;
}
function genPw(){const c="abcdefghjkmnpqrstuvwxyz23456789";let p="";for(let i=0;i<8;i++)p+=c[Math.floor(Math.random()*c.length)];return p}
function inputBox(title,body,label,value,ok,fn){
  $("#modal").innerHTML=`<div class="dialog"><h4>${esc(title)}</h4><p>${esc(body)}</p><input id="mval" aria-label="${esc(label)}" value="${esc(value)}"><div class="row"><button class="btn" id="mno">취소</button><button class="btn primary" id="myes">${esc(ok)}</button></div></div>`;
  $("#modal").classList.remove("hidden"); $("#mno").onclick=closeModal;
  $("#myes").onclick=()=>{const v=$("#mval").value;closeModal();fn(v)}; $("#mval").focus(); $("#mval").select();
}

/* ================= 핵심문제 풀이집 (과목별 풀이 · 해설 문제집) ================= */
// 문제집 id가 study로 시작하면 이 화면을 써요. 과목별로 대표문항·예제를 순서대로(또는 섞어서) 풀고, 고르면 바로 정답·해설이 나와요.
const K_STUDY="slp2cbt.study";
let STUDY=null, st=null;
const isStudy=b=>!!(b&&String(b.id).startsWith("study"));
function buildStudy(rows){
  Object.keys(QMAP).forEach(k=>delete QMAP[k]);
  STUDY={};
  SUBJS.forEach(([sid,name])=>{STUDY[sid]=[]});
  rows.slice().sort((a,b)=>a.n-b.n).forEach(r=>{
    const q=Object.assign({n:r.n},r.data);
    q.sid=r.subject; q.subj=(SUBJS.find(x=>x[0]===r.subject)||[0,r.subject])[1]; q.set="핵심"; q.pid=r.period;
    q.id=`S-${r.subject}-${r.n}`; QMAP[q.id]=q; (STUDY[r.subject]=STUDY[r.subject]||[]).push(q);
  });
}
function studyLabel(q){return q.kind==="연습"?`${q.subj} 연습문제 ${q.topic}`:q.kind==="추가"?`${q.subj} 추가문제 ${q.topic-100}`:`${q.subj} ${q.topic}${q.kind==="예제"?" · 예제":" · 대표문항"}`}
function studyRich(t){ // 주요개념: 빈 줄로 문단 구분, '|'로 시작하는 줄은 표(첫 줄은 머리글), 칸 안 <br>은 줄바꿈
  return String(t).split(/\n\s*\n/).map(b=>{
    const lines=b.split("\n");
    const im=b.trim().match(/^\[\[img:(data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+)\]\]$/);
    if(im) return `<img class="qimg" src="${im[1]}" alt="책 원본 그림">`;
    if(lines.every(l=>l.startsWith("|"))){
      const rows=lines.map(l=>l.slice(1).split("|").map(c=>esc(c).replace(/&lt;br&gt;/g,"<br>")));
      return `<div class="ctwrap"><table class="ctable"><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
    }
    return `<p>${esc(b)}</p>`;
  }).join("");
}
function studyStats(sid){
  const S=LS.get(K_STUDY,{}), A=(S.ans||{}); const qs=STUDY[sid]||[];
  let solved=0,ok=0; qs.forEach(q=>{if(A[q.id]){solved++; if(A[q.id]===q.a) ok++}}); return {n:qs.length,solved,ok};
}
function renderStudyHome(){
  const S=LS.get(K_STUDY,{}), wrong=LS.get(K_WRONG,{});
  const total=Object.keys(QMAP).length;
  let h=`<h1>2급 언어재활사 CBT 연습</h1>
  <p class="lead">과목별로 끝까지 풀고 제출하면 한 번에 채점하고, 정답과 해설을 보여 줘요.</p>
  <div class="userbar"><span>${bookSelHtml()}</span>
    <span>${esc(USER.email)} · ${ROLE==="admin"?`<button class="btn" id="adminBtn" style="padding:4px 10px">이용자 관리</button> `:""}<button class="btn" id="logout" style="padding:4px 10px">로그아웃</button></span></div>`;
  if(S.cur&&S.cur.ids&&S.cur.ids.length){

      <div class="actions"><button class="btn primary" id="stResume">이어서 풀기</button></div></div>`;
  }
  h+=`<div class="sheet"><h2>${esc(BOOK.title)} · ${total}문항</h2><table class="ptable">`;
  SUBJS.forEach(([sid,name])=>{
    const s=studyStats(sid), w=(STUDY[sid]||[]).filter(q=>wrong[q.id]).length;
    h+=`<tr><td class="pname">${name}${s.n?`<span class="tag ready">${s.n}문항</span>`:`<span class="tag wait">준비 중</span>`}
      ${s.n?`<div style="font-size:13px;color:var(--sub);margin-top:4px">푼 문제 ${s.solved}/${s.n}${s.solved?` · 맞힘 ${s.ok} (${Math.round(s.ok/s.solved*100)}%)`:""}${w?` · 오답 ${w}`:""}</div>`:""}</td>
      <td class="num" style="white-space:normal;text-align:right">${s.n?`<button class="btn primary" data-sseq="${sid}" style="margin:2px">순서대로</button><button class="btn" data-srand="${sid}" style="margin:2px">섞어서</button>${w?`<button class="btn" data-swrong="${sid}" style="margin:2px">오답만</button>`:""}`:""}</td></tr>`;
  });
  h+=`</table><p class="note" style="padding-top:12px">'순서대로'는 책에 실린 순서대로 풀어요. 끝까지 푼 뒤 제출하면 점수와 해설이 나와요. 틀린 문제는 '오답만'에 모이고, 다시 맞히면 빠져요.</p>
    <div class="actions"><button class="btn" id="stReset">푼 기록 지우기</button></div></div>`;
  $("#home").innerHTML=h;
  $("#logout").onclick=()=>confirmBox("로그아웃할까요?","기록은 계정에 저장되어 있어서 다시 로그인하면 이어서 볼 수 있어요.","로그아웃",async()=>{await flushSync();await sb.auth.signOut();location.reload()});
  $("#bookSel").onchange=async()=>{await flushSync();await openBook($("#bookSel").value)};
  if($("#adminBtn")) $("#adminBtn").onclick=renderAdmin;
  if($("#stResume")) $("#stResume").onclick=()=>{st=LS.get(K_STUDY,{}).cur;
    if(st.mode!=="exam"){st.mode="exam";st.picks={};st.graded=false;st.pick=null;saveSt()} renderStudy()};
  const start=(label,ids)=>{const S2=LS.get(K_STUDY,{});
    S2.cur={label,ids,pos:0,pick:null,mode:"exam",picks:{},graded:false};LS.set(K_STUDY,S2);st=S2.cur;renderStudy()};
  const name=sid=>SUBJS.find(x=>x[0]===sid)[1];
  $("#home").querySelectorAll("[data-sseq]").forEach(b=>b.onclick=()=>{const sid=b.dataset.sseq;start(`${name(sid)} · 순서대로`,STUDY[sid].map(q=>q.id))});
  $("#home").querySelectorAll("[data-srand]").forEach(b=>b.onclick=()=>{const sid=b.dataset.srand;start(`${name(sid)} · 섞어서`,shuffle(STUDY[sid].map(q=>q.id)))});
  $("#home").querySelectorAll("[data-swrong]").forEach(b=>b.onclick=()=>{const sid=b.dataset.swrong,w=LS.get(K_WRONG,{});start(`${name(sid)} · 오답만`,STUDY[sid].filter(q=>w[q.id]).map(q=>q.id))});
  $("#stReset").onclick=()=>confirmBox("푼 기록을 지울까요?","이 문제집에서 고른 답과 오답 기록이 모두 지워져요.","지우기",()=>{LS.del(K_STUDY);const w=LS.get(K_WRONG,{});Object.keys(w).forEach(id=>{if(QMAP[id])delete w[id]});LS.set(K_WRONG,w);renderHome()});
}
function renderStudy(){
  show("rand");
  document.documentElement.style.setProperty("--fs",[15,17,20][fs]+"px");
  $("#rand").innerHTML=`<div class="topbar"><span class="ttl">${esc(BOOK.title)}</span><span class="meta">${esc(st.label)}</span><span class="sp"></span>
    <span class="rstat" id="rstat"></span>
    <div class="fsbtns">${["작게","보통","크게"].map((t,i)=>`<button data-fs="${i}" aria-pressed="${i===fs}">${t}</button>`).join('')}</div>
    <button class="tbtn" id="rsubmit" hidden>제출하고 채점</button>
    <button class="tbtn" id="rhome">목록으로</button></div>
    <div class="workspace"><main class="rpane" id="rpane" tabindex="-1"></main></div>`;
  $("#rand").querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{fs=+b.dataset.fs;LS.set(K_FS,fs);
    document.documentElement.style.setProperty("--fs",[15,17,20][fs]+"px");
    $("#rand").querySelectorAll("[data-fs]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.fs===fs))});
  $("#rhome").onclick=()=>{st=null;renderHome()};
  $("#rsubmit").onclick=studySubmit;
  if(st.mode==="exam"&&st.graded&&st.showResult) drawStudyResult(); else drawStudy();
}
function drawStudy(){
  const q=QMAP[st.ids[st.pos]]; if(!q){st.pos=Math.min(st.pos+1,st.ids.length-1);return}
  const A=(LS.get(K_STUDY,{}).ans)||{};
  const exam=st.mode==="exam", picks=st.picks||{};
  const my=exam?(picks[q.id]||null):st.pick, done=exam?!!st.graded:my!=null;
  const nAns=exam?st.ids.filter(id=>picks[id]).length:0;
  $("#rstat").textContent=exam&&!st.graded?`${st.pos+1}/${st.ids.length} · 푼 문제 ${nAns}`:`${st.pos+1}/${st.ids.length}`;
  $("#rsubmit").hidden=!(exam&&!st.graded);
  $("#rpane").innerHTML=`<div class="qinner">
    <div class="qhead"><span>${esc(studyLabel(q))}</span>${A[q.id]&&!done&&!exam?`<span>· 전에 ${A[q.id]===q.a?"맞힘":"틀림"}</span>`:""}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.box?`<div class="box">${q.box.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}${q.img?`<img class="qimg" src="${q.img}" alt="문제 그림(책 원본)">`:''}
    <ol class="opts" ${done?'':'role="radiogroup"'}>${q.o.map((t,k)=>{const n=k+1;
      if(!done) return `<li class="opt${my===n?" sel":""}" role="radio" tabindex="0" aria-checked="${my===n}" data-k="${n}"><span class="c">${n}</span><span>${optBody(q,k,t)}</span></li>`;
      const cls=n===q.a?'correct':(n===my?'wrong':''); const lab=n===q.a&&n===my?'정답 · 내 답':n===q.a?'정답':n===my?'내 답':'';
      return `<li class="opt ${cls}"><span class="c">${n}</span><span>${optBody(q,k,t)}</span>${lab?`<span class="lab">${lab}</span>`:''}</li>`}).join('')}</ol>
    ${done?`<p class="rverdict ${my===q.a?'o':'x'}" aria-live="polite">${my===q.a?'정답이에요':my?`오답이에요 · 정답은 ${CIRC[q.a-1]}`:`풀지 않은 문제예요 · 정답은 ${CIRC[q.a-1]}`}</p>
      ${q.note?`<p class="qnote" style="margin:8px 0 0">${esc(q.note)}</p>`:""}
      ${q.key?`<div class="expl"><b>핵심용어</b>${esc(q.key)}</div>`:""}
      <div class="expl"><b>${q.kind==="예제"?"예제풀이":"문제풀이"}</b><div class="ebody">${studyRich(q.e||"")}</div></div>
      ${q.c?`<details class="concept"><summary>${q.kind==="예제"?"추가 학습 개념 보기":"주요개념 보기"}</summary><div class="cbody">${studyRich(q.c)}${q.src?`<p class="csrc">참고도서 · ${esc(q.src)}</p>`:""}</div></details>`:""}
      ${q.rel?`<p class="qnote" style="margin:10px 0 0">관련문항 · ${esc(q.rel)}</p>`:""}`:''}
    <div class="rnext">${st.pos>0?`<button class="btn" id="sprev">← 이전</button>`:""}${exam?(st.graded?`<button class="btn" id="sres">채점 결과</button>${st.pos<st.ids.length-1?`<button class="btn primary" id="snext">다음 해설 →</button>`:""}`:(st.pos<st.ids.length-1?`<button class="btn primary" id="snext">다음 문제 →</button>`:`<button class="btn primary" id="ssub2">제출하고 채점하기</button>`)):(done?(st.pos<st.ids.length-1?`<button class="btn primary" id="snext">다음 문제 →</button>`:`<button class="btn primary" id="sdone">다 풀었어요 · 목록으로</button>`):(st.pos<st.ids.length-1?`<button class="btn" id="sskip">건너뛰기</button>`:""))}</div>
  </div>`;
  const pane=$("#rpane"); pane.classList.toggle("rv",done); pane.style.border="0"; pane.style.borderRadius="0"; pane.style.margin="0";
  if(!done){
    pane.querySelectorAll(".opt").forEach(li=>{li.onclick=()=>studyPick(+li.dataset.k);
      li.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();studyPick(+li.dataset.k)}}});
  }
  const mv=d=>{st.pos+=d;st.pick=null;saveSt();$("#rpane").scrollTop=0;drawStudy()};
  if($("#sprev")) $("#sprev").onclick=()=>mv(-1);
  if($("#snext")) {$("#snext").onclick=()=>mv(1); if(done) $("#snext").focus({preventScroll:true});}
  if($("#sskip")) $("#sskip").onclick=()=>mv(1);
  if($("#sdone")) $("#sdone").onclick=()=>{const S=LS.get(K_STUDY,{});delete S.cur;LS.set(K_STUDY,S);st=null;renderHome()};
  if($("#ssub2")) $("#ssub2").onclick=studySubmit;
  if($("#sres")) $("#sres").onclick=()=>{st.showResult=true;saveSt();drawStudyResult()};
}
function studySubmit(){
  const picks=st.picks||{}, left=st.ids.filter(id=>!picks[id]).length;
  const go=()=>{
    const S=LS.get(K_STUDY,{}); S.ans=S.ans||{}; const wrong=LS.get(K_WRONG,{});
    st.ids.forEach(id=>{const q=QMAP[id]; if(!q) return; const k=picks[id];
      if(k){S.ans[id]=k; if(k===q.a) delete wrong[id]; else wrong[id]={my:k};} else wrong[id]={my:0};});
    st.graded=true; st.showResult=true; S.cur=st; LS.set(K_STUDY,S); LS.set(K_WRONG,wrong); drawStudyResult();
  };
  if(left) confirmBox(`안 푼 문제가 ${left}개 있어요`,"제출하면 안 푼 문제는 틀린 것으로 채점되고 '오답만' 목록에 들어가요.","제출하기",go);
  else confirmBox("제출하고 채점할까요?","제출하면 답을 바꿀 수 없고, 점수와 해설이 나와요.","제출하기",go);
}
function drawStudyResult(){
  const picks=st.picks||{}; let ok=0;
  st.ids.forEach(id=>{const q=QMAP[id]; if(q&&picks[id]===q.a) ok++});
  const N=st.ids.length, pct=N?Math.round(ok/N*100):0;
  $("#rstat").textContent=`${ok}/${N}`; $("#rsubmit").hidden=true;
  const pane=$("#rpane"); pane.classList.remove("rv");
  pane.innerHTML=`<div class="qinner"><h2 style="margin:0 0 6px">채점 결과</h2>
    <p class="rscore"><b>${ok}</b> / ${N}문항 맞힘 · ${pct}점</p>
    <p class="qnote" style="margin:4px 0 12px">번호를 누르면 그 문제의 정답과 해설로 가요. 초록은 맞힌 문제, 빨강은 틀린 문제, 회색은 안 푼 문제예요.</p>
    <div class="rgrid">${st.ids.map((id,i)=>{const q=QMAP[id]; const k=picks[id]; const c=!k?"na":(q&&k===q.a?"o":"x");
      return `<button class="rg ${c}" data-go="${i}" aria-label="${i+1}번 ${c==="o"?"맞힘":c==="x"?"틀림":"안 품"}">${i+1}</button>`}).join("")}</div>
    <div class="rnext"><button class="btn" id="rgHome">목록으로</button><button class="btn primary" id="rgFirst">해설 처음부터 보기</button></div></div>`;
  pane.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.pos=+b.dataset.go;st.showResult=false;saveSt();pane.scrollTop=0;drawStudy()});
  $("#rgFirst").onclick=()=>{st.pos=0;st.showResult=false;saveSt();pane.scrollTop=0;drawStudy()};
  $("#rgHome").onclick=()=>{const S=LS.get(K_STUDY,{});delete S.cur;LS.set(K_STUDY,S);st=null;renderHome()};
}
function saveSt(){const S=LS.get(K_STUDY,{});S.cur=st;LS.set(K_STUDY,S)}
function studyPick(k){
  const q=QMAP[st.ids[st.pos]];
  if(st.mode==="exam"){ if(st.graded) return; st.picks=st.picks||{}; st.picks[q.id]=k; saveSt(); drawStudy(); return; }
  st.pick=k; const S=LS.get(K_STUDY,{}); S.ans=S.ans||{}; S.ans[q.id]=k; S.cur=st; LS.set(K_STUDY,S);
  const wrong=LS.get(K_WRONG,{}); if(k===q.a) delete wrong[q.id]; else wrong[q.id]={my:k}; LS.set(K_WRONG,wrong);
  drawStudy();

const SUBDEF={p1:{name:"1교시",min:75,subs:[["neuro","신경언어장애",30],["flu","유창성장애",25],["voice","음성장애",25]]},
              p2:{name:"2교시",min:65,subs:[["lang","언어발달장애",35],["artic","조음음운장애",35]]}};
function authScreen(msg){
  show("auth");
  $("#auth").innerHTML=`<form class="authbox" id="loginForm" autocomplete="on">
    <img class="authlogo" src="${LOGO}" alt="검단ABA언어행동연구소">
    <h1>2급 언어재활사 CBT 연습</h1><p>등록된 계정으로 로그인해 주세요.</p>
    <label for="em">이메일</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="loginBtn">로그인</button>
    <div class="autherr" id="autherr" role="alert">${msg?esc(msg):""}</div>
    <p style="margin:14px 0 0;font-size:13px">계정이나 비밀번호 문의는 관리자에게 해 주세요.</p></form>`;
  $("#loginForm").onsubmit=async e=>{e.preventDefault();
    const b=$("#loginBtn"); b.disabled=true; b.textContent="로그인 중…"; $("#autherr").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){ b.disabled=false; b.textContent="로그인";
      $("#autherr").textContent=/invalid/i.test(error.message)?"이메일 또는 비밀번호가 맞지 않아요.":"로그인하지 못했어요. 잠시 후 다시 시도해 주세요."; return; }
    boot();
  };
  setTimeout(()=>$("#em")&&$("#em").focus(),50);
}
function loading(t){ show("auth"); $("#auth").innerHTML=`<div class="authbox"><img class="authlogo" src="${LOGO}" alt="검단ABA언어행동연구소"><h1>2급 언어재활사 CBT 연습</h1><p>${esc(t)}</p></div>`; }
async function boot(){
  if(SUPABASE_ANON_KEY.startsWith("여기에")){ show("auth"); $("#auth").innerHTML=`<div class="authbox"><h1>설정이 필요해요</h1><p>index.html 위쪽의 SUPABASE_ANON_KEY에 Supabase anon public key를 넣어 주세요.</p></div>`; return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ authScreen(); return; }
  USER=session.user; loading("불러오는 중…");
  try{
    let {data:mem,error:e1}=await sb.from("cbt_members").select("user_id,role,name").eq("user_id",USER.id).maybeSingle();
    if(e1&&/name/.test(e1.message||"")){ ({data:mem,error:e1}=await sb.from("cbt_members").select("user_id,role").eq("user_id",USER.id).maybeSingle()); }
    if(e1&&/role/.test(e1.message||"")){ ({data:mem,error:e1}=await sb.from("cbt_members").select("user_id").eq("user_id",USER.id).maybeSingle()); }
    if(e1) throw e1;
    if(!mem){ await sb.auth.signOut(); USER=null; authScreen("이 계정은 아직 이용 권한이 없어요. 관리자에게 문의해 주세요."); return; }
    ROLE=mem.role||"member"; USER_NAME=(mem.name||"").trim();
    const {data:books,error:e2}=await sb.from("cbt_books").select("id,title,sort").order("sort");
    if(e2) throw e2;
    BOOKS=books||[]; if(!BOOKS.length){ loading("등록된 문제집이 아직 없어요."); return; }
    const {data:prog,error:e3}=await sb.from("cbt_progress").select("key,value");
    if(e3) throw e3;
    (prog||[]).forEach(r=>{CACHE[r.key]=r.value});
    const last=CACHE["_last_book"]; await openBook(last==="_past"||BOOKS.some(b=>b.id===last)?last:BOOKS[0].id);
  }catch(err){ console.error(err); show("auth"); $("#auth").innerHTML=`<div class="authbox"><h1>불러오지 못했어요</h1><p>인터넷 연결을 확인하고 다시 시도해 주세요.</p><button class="btn primary" onclick="location.reload()">다시 시도</button></div>`; }
}
async function openBook(id){
  loading("문제를 불러오는 중…");
  BOOK=id==="_past"?{id:"_past",title:"국가시험 기출 답안지"}:BOOKS.find(b=>b.id===id); CACHE["_last_book"]=id;
  pending["_last_book"]={v:id}; queueSync();
  if(id==="_past"){ SETS=[]; indexQs(); DATA=null; run=null; rs=null; k14=null; renderHome(); return; }
  const rows=[]; for(let from=0;;from+=1000){
    const {data,error}=await sb.from("cbt_questions").select("set_code,period,subject,n,data").eq("book_id",id).order("set_code").order("period").order("n").range(from,from+999);
    if(error) throw error; rows.push(...data); if(data.length<1000) break; }
  STUDY=null; st=null;
  if(isStudy(BOOK)){ SETS=[]; buildStudy(rows); DATA=null; run=null; rs=null; k14=null; renderHome(); return; }
  const codes=[...new Set(rows.map(r=>r.set_code))].sort();
  SETS=codes.map(L=>({set:L,title:`${BOOK.title} SET ${L}`,periods:["p1","p2"].map(pid=>({id:pid,name:SUBDEF[pid].name,min:SUBDEF[pid].min,
    subjects:SUBDEF[pid].subs.map(([sid,name,count])=>({id:sid,name,count,qs:rows.filter(r=>r.set_code===L&&r.period===pid&&r.subject===sid).map(r=>Object.assign({n:r.n},r.data))}))}))}));
  indexQs();
  DATA=SETS.find(S=>S.set===LS.get(K_SET,null))||SETS[0];
  run=null; rs=null; k14=null;
  renderHome();
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ USER=null; } });
boot();
</script>
